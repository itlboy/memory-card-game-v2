<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5cc2f2">
  <title>Lật Thẻ — Game Thẻ Bài Trí Nhớ</title>
  <!-- Server game riêng (lib/native.ts SERVER_URL): mở sẵn kết nối, đỡ ~370ms cho lời gọi API đầu -->
  <link rel="preconnect" href="https://flipmatch-api.cozypi.com" crossorigin>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Bản cũ chỉ dành cho Safari iOS; Chrome cảnh báo deprecated nên phải có cả hai -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lật Thẻ">
  <meta name="apple-itunes-app" content="app-id=6822105774">  <!-- Smart App Banner: Safari iOS tự hiện thanh "Mở/Tải" app; app (WKWebView) bỏ qua -->

  <!--
    Thẻ chia sẻ. og:image và og:url PHẢI là URL TUYỆT ĐỐI — con bọ đọc thẻ không
    phải trình duyệt, nó không có ngữ cảnh trang để ghép đường dẫn tương đối.

    HAI biến, KHÔNG viết cứng tên miền (đã dính lỗi thật: đổi sang
    thebai.hello314.com mà quên sửa, mọi link chia sẻ trỏ về tên miền cũ đã chết):

      VITE_SITE_URL  — trang người chơi thật sự vào. `og:url` BUỘC dùng cái này:
                       nó là URL chuẩn tắc, chia sẻ ra là người ta bấm vào đó.
                       Trỏ nó sang địa chỉ khác là đẩy người chơi sang origin
                       khác, mất sạch điểm và kỷ lục đang lưu trong localStorage.
      VITE_ASSET_URL — địa chỉ ỔN ĐỊNH chỉ để tải ẢNH og (ví dụ đường
                       *.workers.dev, không bao giờ đổi). Đổi tên miền thì thẻ
                       ảnh vẫn sống. Để trống thì dùng luôn VITE_SITE_URL.
  -->
  <meta name="description" content="Game thẻ bài rèn luyện trí nhớ. Tự đặt luật bàn chơi: đồng hồ, số mạng, xem trước, xáo thẻ. Chơi một mình, với bạn bè, hoặc tạo phòng online bằng mã 6 số.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lật Thẻ">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:url" content="%VITE_SITE_URL%/">
  <meta property="og:title" content="Lật Thẻ">
  <meta property="og:description" content="Game thẻ bài rèn luyện trí nhớ. Tự đặt luật bàn chơi, chơi một mình hoặc với bạn bè.">
  <meta property="og:image" content="%VITE_ASSET_URL%/og.jpg?v=3">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <!-- ?v=2 để Facebook/Zalo coi là ảnh MỚI. Chúng cache thẻ rất lâu; giữ nguyên
       URL thì đổi ảnh rồi vẫn hiện bản cũ. Đổi ảnh lần sau thì nâng số này. -->
  <meta property="og:image:alt" content="Lật Thẻ — game thẻ bài trí nhớ: một lá úp và một lá đã mở trên nền trời xanh, kèm các tính năng chơi một mình, đấu với máy, online cùng bạn bè và đổi giao diện">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Lật Thẻ">
  <meta name="twitter:description" content="Game thẻ bài rèn luyện trí nhớ. Tự đặt luật bàn chơi, chơi một mình hoặc với bạn bè.">
  <meta name="twitter:image" content="%VITE_ASSET_URL%/og.jpg?v=3">
  <!--
    TÔ NỀN NGAY TỪ KHUNG HÌNH ĐẦU (25.11.2026, chủ dự án: "lúc cập nhật hiện màn trắng chói mắt"). CSS của game nằm trong
    gói JS, nên từ lúc trang mở (hoặc app tự khởi động lại để áp bản OTA) tới lúc gói đó chạy xong, trang là màu TRẮNG mặc
    định — người dùng nền tối bị loé. Đoạn dưới chạy TRƯỚC mọi thứ: đọc lựa chọn nền đã lưu (`mm.v2` → prefs.nen, giống
    App.vue `dark`) và tô <html> bằng đúng màu trời của skin Kẹo (`- -bg` ở keo.css: sáng #5cc2f2, tối #1a2456).
    Phải là script NỘI DÒNG (file ngoài thì lại phải chờ tải) và viết MỘT DÒNG: test share-tags coi dòng nào trong <head>
    không mở đầu bằng thẻ là chữ rò ra trang.
    Phần còn lại không sửa được bằng web: trước khi HTML được đọc, WebView vẽ màu nền NATIVE (capacitor.config
    `backgroundColor`) trong tích tắc — đổi nó phải ra bản app.
  -->
  <script>(function(){var n='tu',t=false;try{var p=(JSON.parse(localStorage.getItem('mm.v2')||'{}').prefs)||{};n=p.nen||(p.dark?'toi':'tu')}catch(e){}try{t=n==='toi'||(n==='tu'&&matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){}document.documentElement.style.backgroundColor=t?'#1a2456':'#5cc2f2'})();</script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
