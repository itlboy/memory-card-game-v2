<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
:root{
  --font-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
  --text-xs:11.5px;--text-sm:13px;--text-md:15.5px;--text-lg:18px;--text-xl:22px;
  --bg:#edeffa;--panel:rgba(255,255,255,.86);--panel-solid:#ffffff;--panel-soft:#f5f6ff;
  --fg:#1c1f36;--muted:#63698c;--accent:#6a5cff;--accent-2:#c44cf0;
  --accent-soft:rgba(106,92,255,.13);--line:rgba(96,92,168,.17);--line-strong:rgba(96,92,168,.3);
  --ok:#0b815a;--gold:#b88600;--bad:#dd1f25;--muted-line:rgba(96,92,168,.17);
  --elev-1:0 1px 3px rgba(30,27,75,.09),0 4px 14px rgba(30,27,75,.08);
  --elev-2:0 2px 6px rgba(30,27,75,.1),0 12px 32px rgba(30,27,75,.14);
  --card-back-glow:rgba(106,92,255,.4);
  --inner-light:inset 0 1px 0 rgba(255,255,255,.65);
}
*{box-sizing:border-box}
body{
  margin:0;width:390px;height:844px;overflow:hidden;
  font:400 16px/1.5 var(--font-body);color:var(--fg);
  background:
    radial-gradient(52rem 34rem at 88% -10%,rgba(124,92,255,.2),transparent 60%),
    radial-gradient(46rem 32rem at -12% 104%,rgba(56,189,248,.16),transparent 55%),
    var(--bg);
}
a{color:var(--accent);text-decoration:none}
a:hover{color:#5947e8}
.app{display:flex;flex-direction:column;height:100%;padding:8px}
.panel{
  display:flex;flex-direction:column;flex:1;min-height:0;
  background:var(--panel);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:18px;padding:20px;
  box-shadow:var(--elev-2),var(--inner-light);
}
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.head h2{flex:1;margin:0;font-family:var(--font-display);font-size:19px;font-weight:700}
.back{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;padding:4px 12px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel-solid);
  box-shadow:var(--elev-1),var(--inner-light);color:var(--fg);
}
.btn-primary{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;width:100%;border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;letter-spacing:.02em;
  box-shadow:0 8px 22px var(--card-back-glow),inset 0 1px 0 rgba(255,255,255,.35);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:8px 12px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel-solid);
  box-shadow:var(--elev-1),var(--inner-light);color:var(--fg);
  font:inherit;font-size:var(--text-sm);font-weight:700;
}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field span{font-size:var(--text-sm);font-weight:700;color:var(--muted)}
.input{
  display:flex;align-items:center;min-height:48px;padding:0 14px;
  border:2px solid var(--line);border-radius:14px;background:var(--panel-soft);
}
.input.ph{color:var(--muted)}


.game{display:flex;flex-direction:column;gap:8px;height:100%;padding:8px}
.hud{
  display:flex;align-items:center;gap:9px;min-height:44px;padding:6px 10px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--elev-1),var(--inner-light);
}
.hud .st{display:flex;flex-direction:column;line-height:1.1}
.hud .st b{font-family:var(--font-display);font-size:var(--text-md);font-weight:800}
.hud .st small{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.hud .grow{flex:1}
.hud .x{
  display:flex;align-items:center;justify-content:center;width:30px;height:30px;
  border:1px solid var(--line);border-radius:10px;color:var(--muted);background:var(--panel-solid);
}
.board{
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);
  grid-auto-rows:1fr;gap:6px;align-content:center;
}
.card{
  border-radius:9px;background:linear-gradient(150deg,#6a5cff 0%,#8b5cf6 52%,#c44cf0 100%);
  box-shadow:var(--elev-1),inset 0 1px 0 rgba(255,255,255,.3);
}
.card.up{
  background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.tag{
  align-self:flex-start;display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.04em;
}

.stripA{display:flex;gap:4px}
.chipA{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:4px 2px;border:2px solid var(--line);border-radius:11px;
  background:var(--panel);box-shadow:var(--elev-1);
}
.chipA .av{font-size:16px;line-height:1}
.chipA .pt{font-family:var(--font-display);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.chipA.active{
  border-color:transparent;color:#fff;
  background:linear-gradient(150deg,#6a5cff,#8b5cf6);
  box-shadow:0 0 0 1px var(--accent),0 4px 14px var(--card-back-glow);
}
.chipA.active .nm{
  font-family:var(--font-display);font-size:10px;font-weight:800;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chipA.zero{opacity:.62}

  </style>
</helmet>
<div class="game">
  <div class="hud">
    <span class="st"><b>7</b><small>CẶP</small></span>
    <span class="st"><b>23</b><small>LƯỢT</small></span>
    <span class="grow"></span>
    <span class="st" style="text-align:right"><b>1:48</b><small>THỜI GIAN</small></span>
    <span class="x"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M6 6l12 12M18 6L6 18"/></svg></span>
  </div>
  <div class="stripA">
    <span class="chipA active"><span class="av">🦊</span><span class="nm">Kiên</span><span class="pt">48</span></span>
    <span class="chipA"><span class="av">🐼</span><span class="pt">36</span></span>
    <span class="chipA"><span class="av">🐯</span><span class="pt">24</span></span>
    <span class="chipA"><span class="av">🐸</span><span class="pt">24</span></span>
    <span class="chipA"><span class="av">🐵</span><span class="pt">12</span></span>
    <span class="chipA"><span class="av">🐨</span><span class="pt">12</span></span>
    <span class="chipA zero"><span class="av">🦁</span><span class="pt">0</span></span>
    <span class="chipA zero"><span class="av">🐷</span><span class="pt">0</span></span>
    <span class="chipA zero"><span class="av">🐧</span><span class="pt">0</span></span>
    <span class="chipA zero"><span class="av">🐙</span><span class="pt">0</span></span>
  </div>
  <div class="board"><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card up">🦊</span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card up">🌵</span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span><span class="card"></span></div>
  <span class="tag">A · THU GỌN DẦN — DẢI CAO 46px</span>
</div>
</x-dc>
</body>
</html>
