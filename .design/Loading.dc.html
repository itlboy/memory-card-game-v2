<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
:root{
  --font-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
  --text-xs:11.5px;--text-sm:13px;--text-md:15.5px;--text-lg:18px;--text-xl:22px;
  --bg:#edeffa;--panel:rgba(255,255,255,.86);--panel-solid:#ffffff;--panel-soft:#f5f6ff;
  --fg:#1c1f36;--muted:#63698c;--accent:#6a5cff;--accent-2:#c44cf0;
  --accent-soft:rgba(106,92,255,.13);--line:rgba(96,92,168,.17);--line-strong:rgba(96,92,168,.3);
  --ok:#0b815a;--gold:#b88600;--bad:#dd1f25;--muted-line:rgba(96,92,168,.17);
  --elev-1:0 1px 3px rgba(30,27,75,.09),0 4px 14px rgba(30,27,75,.08);
  --elev-2:0 2px 6px rgba(30,27,75,.1),0 12px 32px rgba(30,27,75,.14);
  --card-back-glow:rgba(106,92,255,.4);
  --inner-light:inset 0 1px 0 rgba(255,255,255,.65);
}
*{box-sizing:border-box}
body{
  margin:0;width:390px;height:844px;overflow:hidden;
  font:400 16px/1.5 var(--font-body);color:var(--fg);
  background:
    radial-gradient(52rem 34rem at 88% -10%,rgba(124,92,255,.2),transparent 60%),
    radial-gradient(46rem 32rem at -12% 104%,rgba(56,189,248,.16),transparent 55%),
    var(--bg);
}
a{color:var(--accent);text-decoration:none}
a:hover{color:#5947e8}
.app{display:flex;flex-direction:column;height:100%;padding:8px}
.panel{
  display:flex;flex-direction:column;flex:1;min-height:0;
  background:var(--panel);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:18px;padding:20px;
  box-shadow:var(--elev-2),var(--inner-light);
}
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.head h2{flex:1;margin:0;font-family:var(--font-display);font-size:19px;font-weight:700}
.back{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;padding:4px 12px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel-solid);
  box-shadow:var(--elev-1),var(--inner-light);color:var(--fg);
}
.btn-primary{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;width:100%;border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;letter-spacing:.02em;
  box-shadow:0 8px 22px var(--card-back-glow),inset 0 1px 0 rgba(255,255,255,.35);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:8px 12px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel-solid);
  box-shadow:var(--elev-1),var(--inner-light);color:var(--fg);
  font:inherit;font-size:var(--text-sm);font-weight:700;
}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field span{font-size:var(--text-sm);font-weight:700;color:var(--muted)}
.input{
  display:flex;align-items:center;min-height:48px;padding:0 14px;
  border:2px solid var(--line);border-radius:14px;background:var(--panel-soft);
}
.input.ph{color:var(--muted)}


.list-head{
  display:flex;align-items:center;gap:8px;margin:18px 0 10px;
}
.list-head h3{
  flex:1;margin:0;font-family:var(--font-display);font-size:var(--text-md);font-weight:700;
}
.list-head .count{
  font-size:var(--text-xs);font-weight:800;color:var(--accent);
  background:var(--accent-soft);padding:3px 9px;border-radius:999px;
}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel-solid);color:var(--muted);box-shadow:var(--elev-1);
}
.rooms{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden;list-style:none;margin:0;padding:0}
.room{
  display:flex;align-items:center;gap:11px;min-height:64px;padding:9px 11px;
  border:2px solid var(--line);border-radius:14px;background:var(--panel-soft);
}
.room .av{
  display:flex;align-items:center;justify-content:center;
  width:42px;height:42px;flex-shrink:0;border-radius:12px;font-size:22px;
  background:linear-gradient(150deg,#6a5cff,#8b5cf6);
  box-shadow:var(--elev-1),inset 0 1px 0 rgba(255,255,255,.32);
}
.room .body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.room .name{
  font-family:var(--font-display);font-size:var(--text-md);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.room .meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:var(--text-xs);font-weight:600}
.room .meta i{display:inline-flex;align-items:center;gap:3px;font-style:normal}
.room .slots{
  display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;
  padding:4px 9px;border-radius:12px;background:rgba(11,129,90,.12);color:var(--ok);
}
.room .slots b{font-family:var(--font-display);font-size:var(--text-md);font-weight:800;line-height:1}
.room .slots small{font-size:9.5px;font-weight:700;letter-spacing:.02em}
.room .slots.tight{background:rgba(184,134,0,.14);color:var(--gold)}
.room .go{color:var(--muted);flex-shrink:0}
.link-row{
  display:flex;align-items:center;justify-content:center;gap:7px;
  margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  color:var(--accent);font-size:var(--text-sm);font-weight:700;
}

.sk{background:var(--panel-soft);border-color:var(--line)}
.sk .bar{border-radius:999px;background:linear-gradient(90deg,rgba(96,92,168,.15),rgba(96,92,168,.26),rgba(96,92,168,.15));background-size:200% 100%;animation:sh 1.3s linear infinite}
.sk .av-sk{width:42px;height:42px;border-radius:12px;flex-shrink:0;background:linear-gradient(90deg,rgba(96,92,168,.15),rgba(96,92,168,.26),rgba(96,92,168,.15));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loading-note{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:12px;color:var(--muted);font-size:var(--text-sm);font-weight:700;
}
.spin{animation:rot 1s linear infinite;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}

  </style>
</helmet>
<div class="app">
  <div class="panel">
    <div class="head">
      <span class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M15 18l-6-6 6-6"/></svg></span>
      <h2>Chơi online</h2>
    </div>

    <div class="btn-primary"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 5v14M5 12h14"/></svg> Tạo phòng mới</div>

    <div class="list-head">
      <h3>Phòng đang chờ</h3>
      <span class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg></span>
    </div>

    <ul class="rooms">
      <li class="room sk">
        <span class="av-sk"></span>
        <span class="body">
          <span class="bar" style="height:13px;width:62%"></span>
          <span class="bar" style="height:10px;width:44%;margin-top:7px"></span>
        </span>
        <span class="bar" style="height:34px;width:44px;border-radius:12px"></span>
      </li>
      <li class="room sk">
        <span class="av-sk"></span>
        <span class="body">
          <span class="bar" style="height:13px;width:48%"></span>
          <span class="bar" style="height:10px;width:52%;margin-top:7px"></span>
        </span>
        <span class="bar" style="height:34px;width:44px;border-radius:12px"></span>
      </li>
      <li class="room sk">
        <span class="av-sk"></span>
        <span class="body">
          <span class="bar" style="height:13px;width:70%"></span>
          <span class="bar" style="height:10px;width:38%;margin-top:7px"></span>
        </span>
        <span class="bar" style="height:34px;width:44px;border-radius:12px"></span>
      </li>
      <li class="room sk">
        <span class="av-sk"></span>
        <span class="body">
          <span class="bar" style="height:13px;width:54%"></span>
          <span class="bar" style="height:10px;width:46%;margin-top:7px"></span>
        </span>
        <span class="bar" style="height:34px;width:44px;border-radius:12px"></span>
      </li>
    </ul>

    <div class="loading-note"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg> Đang tìm phòng…</div>
    <div class="link-row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg> Có mã phòng? Nhập mã 6 số</div>
  </div>
</div>
</x-dc>
</body>
</html>
