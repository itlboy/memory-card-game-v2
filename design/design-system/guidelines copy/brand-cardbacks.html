<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body)}</style></head><body><div style="display:flex;gap:20px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:132px;aspect-ratio:3/4;border-radius:12px;background:url(../assets/card-backs/stars.svg) center/100% 100% no-repeat,radial-gradient(circle at 30% 18%,rgba(255,255,255,.22),transparent 45%),linear-gradient(160deg,#4c3fd6 0%,#7b46e6 55%,#b74cf0 100%);box-shadow:var(--elev-1),inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 2px rgba(255,255,255,.12)"></div><b style="font-size:11.5px;font-family:var(--font-display)">stars</b></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:132px;aspect-ratio:3/4;border-radius:12px;background:url(../assets/card-backs/diamond.svg) center/100% 100% no-repeat,linear-gradient(180deg,#5a4be0 0%,#6a5cff 100%);box-shadow:var(--elev-1),inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 2px rgba(255,255,255,.12)"></div><b style="font-size:11.5px;font-family:var(--font-display)">diamond</b></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:132px;aspect-ratio:3/4;border-radius:12px;background:url(../assets/card-backs/aurora.svg) center/100% 100% no-repeat,radial-gradient(circle at 72% 12%,rgba(255,255,255,.16),transparent 40%),linear-gradient(185deg,#241c6e 0%,#4c3fd6 62%,#7b46e6 100%);box-shadow:var(--elev-1),inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 2px rgba(255,255,255,.12)"></div><b style="font-size:11.5px;font-family:var(--font-display)">aurora</b></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:132px;aspect-ratio:3/4;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:72px;background:radial-gradient(circle at 50% 58%,var(--accent-soft),transparent 62%),var(--card-face);border:1px solid var(--line);box-shadow:var(--elev-1),var(--inner-light)">🦊</div><b style="font-size:11.5px;font-family:var(--font-display)">face</b></div></div></body></html>
