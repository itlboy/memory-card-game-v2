<!-- @dsCard group="Spacing" viewport="700x160" name="Radius scale" subtitle="10 / 14 / 18 / pill — plus the 12px card" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body)}</style></head><body><div style="display:flex;gap:16px"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:92px;height:64px;border-radius:10px;background:var(--panel-soft);border:2px solid var(--line)"></div><b style="font-size:11px;font-family:var(--font-display)">--r-sm</b><small style="font-size:10.5px;color:var(--muted)">10px</small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:92px;height:64px;border-radius:14px;background:var(--panel-soft);border:2px solid var(--line)"></div><b style="font-size:11px;font-family:var(--font-display)">--r-md</b><small style="font-size:10.5px;color:var(--muted)">14px</small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:92px;height:64px;border-radius:12px;background:var(--panel-soft);border:2px solid var(--line)"></div><b style="font-size:11px;font-family:var(--font-display)">--card-radius</b><small style="font-size:10.5px;color:var(--muted)">12px</small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:92px;height:64px;border-radius:18px;background:var(--panel-soft);border:2px solid var(--line)"></div><b style="font-size:11px;font-family:var(--font-display)">--r-lg</b><small style="font-size:10.5px;color:var(--muted)">18px</small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:92px;height:64px;border-radius:999px;background:var(--panel-soft);border:2px solid var(--line)"></div><b style="font-size:11px;font-family:var(--font-display)">--r-full</b><small style="font-size:10.5px;color:var(--muted)">999px</small></div></div></body></html>
