<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:150px;height:88px;border-radius:14px;background:var(--grad-primary);box-shadow:0 8px 22px var(--card-back-glow),inset 0 1px 0 rgba(255,255,255,.35)"></div><b style="font-size:11px;font-family:var(--font-display)">brand glow</b></div></div></body></html>
