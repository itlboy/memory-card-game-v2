<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:#a99cff;border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">brand-300</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">#a99cff</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:#6a5cff;border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">brand-500</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">#6a5cff · accent</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:#5947e8;border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">brand-600</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">#5947e8</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:#c44cf0;border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">pink-500</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">#c44cf0 · accent-2</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:#38bdf8;border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">cyan-400</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">#38bdf8</small></div></div></body></html>
