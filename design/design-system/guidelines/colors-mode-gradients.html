<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--g-violet);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">g-violet</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">Chiến dịch</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--g-blue);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">g-blue</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">Cổ điển</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--g-amber);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">g-amber</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">Đua thời gian</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--g-red);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">g-red</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">Sinh tồn</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--g-teal);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">g-teal</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">Chớp nhoáng</small></div></div><div style="height:12px"></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--g-pink);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">g-pink</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">Nhiều người</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--g-cyan);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">g-cyan</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">Online</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--grad-primary);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">grad-primary</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">CTA</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--grad-selected);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">grad-selected</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">Ô đang chọn</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:linear-gradient(100deg,var(--accent),var(--accent-2));border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">accent → accent-2</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">Brand wordmark</small></div></div></body></html>
