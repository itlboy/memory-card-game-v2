<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base, six steps" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body)}</style></head><body><div style="display:flex;gap:18px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:4px;height:4px;background:var(--accent);border-radius:3px"></div><b style="font-size:11px;font-family:var(--font-display)">--sp-1</b><small style="font-size:10.5px;color:var(--muted)">4px</small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:8px;height:8px;background:var(--accent);border-radius:3px"></div><b style="font-size:11px;font-family:var(--font-display)">--sp-2</b><small style="font-size:10.5px;color:var(--muted)">8px</small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:12px;height:12px;background:var(--accent);border-radius:3px"></div><b style="font-size:11px;font-family:var(--font-display)">--sp-3</b><small style="font-size:10.5px;color:var(--muted)">12px</small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:16px;height:16px;background:var(--accent);border-radius:3px"></div><b style="font-size:11px;font-family:var(--font-display)">--sp-4</b><small style="font-size:10.5px;color:var(--muted)">16px</small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:20px;height:20px;background:var(--accent);border-radius:3px"></div><b style="font-size:11px;font-family:var(--font-display)">--sp-5</b><small style="font-size:10.5px;color:var(--muted)">20px</small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:24px;height:24px;background:var(--accent);border-radius:3px"></div><b style="font-size:11px;font-family:var(--font-display)">--sp-6</b><small style="font-size:10.5px;color:var(--muted)">24px</small></div></div></body></html>
