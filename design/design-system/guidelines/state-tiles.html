<!-- @dsCard group="Brand" viewport="700x210" name="Tile states" subtitle="Identity tiles keep their colour; config tiles burst violet" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:12px">
<div class="neon g-blue" style="border-radius:14px;padding:14px;height:86px;display:flex;flex-direction:column;justify-content:center"><strong>Cổ điển</strong><small>identity · always lit</small></div>
<div class="neon g-blue" style="border-radius:14px;padding:14px;height:86px;outline:3px solid rgba(255,255,255,.85);outline-offset:-3px;display:flex;flex-direction:column;justify-content:center"><strong>Cổ điển</strong><small>selected · white outline</small></div>
<div style="border:2px solid var(--line);border-radius:14px;padding:14px;height:86px;background:var(--panel-soft);display:flex;flex-direction:column;justify-content:center"><strong>4×4</strong><small style="color:var(--muted)">config · resting</small></div>
<div style="border:2px solid transparent;border-radius:14px;padding:14px;height:86px;background:var(--grad-selected);color:#fff;box-shadow:0 8px 26px rgba(106,92,255,.5),inset 0 1px 0 rgba(255,255,255,.3);display:flex;flex-direction:column;justify-content:center"><strong>4×4</strong><small style="color:rgba(255,255,255,.85)">config · selected</small></div></div></body></html>
