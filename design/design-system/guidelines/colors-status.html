<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="ok, warn, gold, bad, accent-soft" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--ok);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">ok</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">#0ea371 · matched</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--warn);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">warn</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">#ea8c00 · peek</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--gold);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">gold</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">#d99e00 · stars, x2 combo</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--bad);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">bad</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">#e5484d · wrong, danger</small></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line)"></div><b style="font-size:12px;font-family:var(--font-display)">accent-soft</b><small style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">13% violet</small></div></div></body></html>
