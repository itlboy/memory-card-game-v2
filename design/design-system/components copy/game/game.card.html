<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body)}.stack{display:flex;flex-direction:column;gap:10px}.strip{display:flex;gap:6px}.cards{display:flex;gap:10px}.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:300px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const { HudBar, PlayerChip, BoardGrid, CardTile, CampaignNode, GridPreview, Toast, EmojiBar } = window.MemoryMatchDesignSystem_ce0961;
const board = [
  { symbol: '🦊', matched: true }, { symbol: '🐼', faceUp: true }, {}, {},
  {}, { symbol: '🐯', wrong: true }, {}, { power: 'bomb' }
];
function Demo(){
  return (
    <div className="stack">
      <HudBar score={1240} moves={14} matched={5} totalPairs={8} combo={2} elapsed={62} levelId={7} />
      <div className="strip">
        <PlayerChip name="An" score={300} index={0} active turnLeft={8} lives={4} />
        <PlayerChip name="Bình" score={200} index={1} lives={5} doubleNext />
        <PlayerChip name="Chi" score={100} index={2} lives={2} frozen />
      </div>
      <Toast tone="peek">👀 Ghi nhớ vị trí các thẻ…</Toast>
      <div style={{ display: 'flex', gap: 18, alignItems: 'flex-start' }}>
        <BoardGrid cols={4} cards={board} back="stars" style={{ width: 260 }} />
        <div className="cards" style={{ width: 200 }}>
          <CardTile symbol="🍕" back="diamond" style={{ width: 62 }} />
          <CardTile symbol="🍕" back="diamond" faceUp style={{ width: 62 }} />
          <CardTile symbol="🍕" back="diamond" matched style={{ width: 62 }} />
        </div>
        <div className="nodes">
          <CampaignNode id={1} cols={2} rows={2} stars={3} />
          <CampaignNode id={2} cols={3} rows={3} stars={2} />
          <CampaignNode id={3} cols={3} rows={4} stars={1} />
          <CampaignNode id={4} cols={4} rows={4} />
          <CampaignNode id={5} cols={4} rows={5} locked />
        </div>
      </div>
      <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
        <GridPreview cols={5} rows={5} />
        <GridPreview cols={6} rows={6} />
        <EmojiBar />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
