# Lật Thẻ — server dự phòng chạy trên cụm MicroK8s ở nhà.
#
# Đường đi của một request:
#   thebai-server.hello314.com
#     → Cloudflare (wildcard *.hello314.com trỏ tunnel kien-server-main-vm)
#     → route mặc định của tunnel → ingress-nginx
#     → service thebai-server:80 → pod cổng 8080
#
# Không cần thêm bản ghi DNS: wildcard đã lo. Không cần TLS ở đây: Cloudflare
# cắt TLS ở biên, trong cụm chạy http trần như mọi dịch vụ khác.
apiVersion: v1
kind: Namespace
metadata:
  name: thebai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thebai-server
  namespace: thebai
  labels:
    app: thebai-server
  annotations:
    # Keel theo dõi ảnh này và tự thay khi GHCR có bản mới.
    # force + latest: so DIGEST chứ không so tên tag, vì tag `latest` không đổi tên.
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 2m"
spec:
  # PHẢI LÀ 1, KỂ CẢ KHI ĐÃ CÓ MYSQL. Phòng có được lưu xuống database thì đó
  # cũng chỉ là để sống sót qua một lần thay ảnh — nó KHÔNG cho chạy nhiều pod:
  # WebSocket dính vào một pod, engine chạy trong RAM của chính pod đó, alarm là
  # setTimeout trong pod, và broadcast không đi qua database. Hai pod là hai bản
  # sao cùng một phòng ghi đè nhau, còn hai người cùng mã phòng thì không thấy
  # nhau. Thứ phải làm trước khi scale là ĐỊNH TUYẾN DÍNH theo mã phòng, không
  # phải thêm kho dữ liệu.
  replicas: 1
  strategy:
    # Recreate chứ không RollingUpdate: rolling sẽ có lúc hai pod cùng sống,
    # đúng cái vừa nói ở trên. Đổi lại là có ~10 giây đứt khi cập nhật — chấp
    # nhận được, và ván đang chơi vốn cũng mất khi pod chết.
    type: Recreate
  selector:
    matchLabels:
      app: thebai-server
  template:
    metadata:
      labels:
        app: thebai-server
    spec:
      # Pod cũ phải chết NHANH: `Recreate` chờ nó biến mất hẳn rồi mới dựng pod
      # mới, nên mỗi giây nấn ná ở đây là một giây phòng online đứt. Server bắt
      # SIGTERM, đẩy nốt phần chờ ghi rồi thoát ngay — không cần 30 giây mặc
      # định để làm việc đó.
      terminationGracePeriodSeconds: 5
      containers:
        - name: server
          image: ghcr.io/itlboy/memory-card-game-v2/lat-the-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: production
            # Phòng ghi xuống MySQL để CẬP NHẬT ẢNH KHÔNG MẤT PHÒNG (xem
            # mysql.yaml và apps/node-server/src/kho-mysql.ts). Bỏ biến này thì
            # server vẫn chạy — chỉ quay lại hành vi cũ: phòng chỉ ở trong RAM.
            # Ghi là ghi TRỄ nên MySQL không nằm trên đường đi của nước lật thẻ.
            # THỨ TỰ QUAN TRỌNG: k8s chỉ thay $(VAR) bằng biến đã khai
            # TRƯỚC nó trong danh sách này. Đặt MYSQL_URL lên trên là nó giữ
            # nguyên chuỗi "$(MYSQL_ROOT_PASSWORD)" và mọi kết nối sai mật khẩu.
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: thebai-mysql
                  key: MYSQL_ROOT_PASSWORD
            # Mật khẩu nằm trong URL nên PHẢI tránh ký tự @ : / ? # trong đó —
            # không thì URL vỡ. Chọn mật khẩu chỉ gồm chữ và số là xong.
            - name: MYSQL_URL
              value: "mysql://root:$(MYSQL_ROOT_PASSWORD)@thebai-mysql:3306/latthe"
          # Hỏi SỚM và DÀY. Server Node lên trong khoảng một giây, nên chờ 3
          # giây rồi kiểm mỗi 5 giây là tự thêm vài giây chết vào mỗi lần
          # deploy — mà client chỉ im lặng 5 giây đầu trước khi báo "mất kết
          # nối" cho người chơi. Đo được: 7 giây trước khi sửa.
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 1
            periodSeconds: 1
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: thebai-server
  namespace: thebai
spec:
  # ClusterIP, KHÔNG LoadBalancer: đường ra Internet duy nhất là tunnel.
  type: ClusterIP
  selector:
    app: thebai-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thebai-server
  namespace: thebai
  annotations:
    # WebSocket: phòng online giữ kết nối mở lâu. Thiếu timeout dài thì nginx
    # cắt ngang giữa ván sau 60 giây mặc định.
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    # Hai tên miền, MỘT pod. Client lấy địa chỉ server bằng `location.origin`
    # (xem apps/web/src/composables/useOnlineRoom.ts), nên mở bằng tên nào thì
    # phòng online chạy trên chính tên đó — không CORS, không cần build riêng
    # cho từng tên miền, và cả hai cùng đi theo bản mới mà Keel thay.
    - host: thebai-server.hello314.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thebai-server
                port:
                  number: 80
    - host: thebai2.hello314.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thebai-server
                port:
                  number: 80
