# Đóng ảnh Docker cho SERVER DỰ PHÒNG (apps/node-server) rồi đẩy lên GHCR.
#
# Vì sao có việc này: Cloudflare có hôm lag từ Việt Nam và cả phòng lỗi. Có ảnh
# sẵn thì dựng lại bản dự phòng ở Hà Nội chỉ bằng một lệnh `docker run`, không
# phải build trên máy chủ.
#
# KHÔNG chạm tới bản Cloudflare: deploy CF vẫn là `pnpm release` chạy tay.
name: Ảnh Docker (server dự phòng)

on:
  push:
    branches: [main]
    # Chỉ chạy khi thứ ẢNH THẬT SỰ CHỨA có đổi. Không lọc thì mỗi lần sửa README
    # là một lần build 5 phút vô ích.
    paths:
      - 'apps/node-server/**'
      - 'apps/server/src/**'
      - 'apps/web/**'
      - 'packages/engine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/lat-the-server

jobs:
  kiem-tra:
    name: Test trước khi đóng ảnh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # KHÔNG khai `version` ở đây: repo đã ghi `packageManager: pnpm@10.0.0`
      # trong package.json, khai cả hai chỗ thì action dừng với
      # "Multiple versions of pnpm specified". Để một nguồn duy nhất, và nâng
      # pnpm thì chỉ sửa package.json.
      - uses: pnpm/action-setup@v4
      # Node 22, KHÔNG phải 20, vì hai lý do:
      #  - bộ smoke dùng `WebSocket` TOÀN CỤC, mà Node 20 chưa có nó (phải bật
      #    cờ --experimental-websocket); chạy trên 20 là "WebSocket is not defined";
      #  - Node 20 đã hết hạn hỗ trợ từ 4/2026.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Đóng ảnh từ code chưa chạy test là cách chắc nhất để đẩy lỗi lên máy chủ
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Bộ smoke chạy THẲNG vào server Node vừa gói — đây là thứ duy nhất chứng
      # minh bản dự phòng nói cùng giao thức với bản Cloudflare.
      - name: Smoke E2E trên server Node
        run: |
          pnpm --filter @mm/node-server build
          cd apps/node-server
          PORT=8090 WEB_DIR=../../apps/web/dist node dist/server.mjs & echo $! > /tmp/srv.pid
          cd ../..
          for i in $(seq 1 30); do
            curl -sf -m 1 http://127.0.0.1:8090/health >/dev/null && break || sleep 1
          done
          export MM_SERVER=http://127.0.0.1:8090
          # Bốn bộ smoke chạy SONG SONG: mỗi bộ tự tạo phòng riêng bằng mã riêng
          # nên không bộ nào thấy phòng của bộ khác. Đo thật trên server Node:
          # 50s tuần tự → 16s song song. Phải tự gom exit code — `wait` không có
          # tham số trả về 0 kể cả khi một tiến trình con chết, là cách chắc nhất
          # để smoke đỏ mà ảnh vẫn được đẩy đi.
          pids=""
          for s in online options peek leave-cancel; do
            node "tools/smoke-$s.mjs" & pids="$pids $!"
          done
          rc=0
          for p in $pids; do wait "$p" || rc=1; done
          kill "$(cat /tmp/srv.pid)"
          exit $rc

  dong-anh:
    name: Đóng và đẩy ảnh
    needs: kiem-tra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nhãn ảnh
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/node-server/Dockerfile
          # linux/arm64 kèm theo vì VPS ở Việt Nam hay là ARM (Ampere), mà chạy
          # ảnh amd64 qua QEMU thì chậm thấy rõ
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
