# Đóng gói app Android + iOS (Capacitor) — KHÔNG cần build ở máy local.
#
# Ba mức, tự lên mức theo secret đã có (thiếu secret thì bước đó tự bỏ qua,
# workflow vẫn xanh — điền secret xong là chạy, không phải sửa file này):
#   1. Không secret nào   → APK debug (cài thử thẳng lên máy Android) + build
#                           iOS cho simulator (chứng minh project iOS còn biên dịch).
#   2. Có khoá ký         → AAB/APK release đã ký (Android); IPA đã ký (iOS).
#   3. Chế độ PHÁT HÀNH   → đẩy AAB lên Google Play, IPA lên TestFlight.
#      PHÁT HÀNH = đẩy tag `app-v*` hoặc chạy tay với ô "Đẩy lên store".
#
# Danh sách secret và cách lấy: docs/mobile-ci.md.
name: App mobile (Android + iOS)

on:
  push:
    # develop cũng chạy: mỗi lần đẩy là có APK mới để cài thử trước khi lên main
    branches: [main, develop]
    tags: ['app-v*']
    paths:
      - 'apps/web/**'
      - 'packages/engine/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      phat_hanh:
        description: 'Đẩy lên store (Google Play + TestFlight)'
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  PHAT_HANH: ${{ startsWith(github.ref, 'refs/tags/app-v') || inputs.phat_hanh == true }}
  # Số bản dựng = số lần chạy workflow này: luôn tăng, mà cả Play lẫn App Store
  # đều từ chối bản trùng số. Đổi tên/tạo lại workflow là run_number về 1 —
  # khi đó đặt biến repo VERSION_CODE_OFFSET lớn hơn số đã dùng.
  SO_BAN: ${{ github.run_number }}
  BU_SO_BAN: ${{ vars.VERSION_CODE_OFFSET || '0' }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      CO_KHOA: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      CO_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7
      # KHÔNG khai `version`: pnpm lấy từ `packageManager` trong package.json (xem docker.yml)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dựng web rồi chép vào project Android
        working-directory: apps/web
        run: pnpm build:android
      # Capacitor 8 cần JDK 21
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Số phiên bản
        id: ver
        run: |
          echo "name=$(node -p "require('./apps/web/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "code=$(( SO_BAN + BU_SO_BAN ))" >> "$GITHUB_OUTPUT"

      - name: APK debug (cài thử)
        working-directory: apps/web/android
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: lat-the-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-debug.apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: AAB + APK release đã ký
        if: env.CO_KHOA == 'true'
        working-directory: apps/web/android
        env:
          KHOA_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          echo "$KHOA_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon bundleRelease assembleRelease -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }}
          rm -f "$ANDROID_KEYSTORE_PATH"
      - if: env.CO_KHOA == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lat-the-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-release
          path: |
            apps/web/android/app/build/outputs/bundle/release/app-release.aab
            apps/web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # App MỚI thì Play bắt tải AAB đầu tiên bằng tay trên web (bước này sẽ lỗi
      # "Package not found" cho tới lúc đó). Chưa phát hành lần nào thì Play chỉ
      # nhận status `draft` — đổi biến repo PLAY_RELEASE_STATUS=completed sau.
      - name: Đẩy lên Google Play
        if: env.PHAT_HANH == 'true' && env.CO_KHOA == 'true' && env.CO_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hello314.flipmatch
          releaseFiles: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  ios:
    name: iOS
    # Capacitor 8 cần Xcode 26
    runs-on: macos-26
    env:
      # Ký cần CHỨNG CHỈ + PROFILE (tools/tao-ky-ios.mjs tạo, mỗi năm một lần);
      # đẩy TestFlight cần thêm API key. Thiếu bộ ký thì chỉ build simulator.
      CO_KY: ${{ secrets.APPLE_TEAM_ID != '' && secrets.IOS_DIST_P12_BASE64 != '' && secrets.IOS_DIST_P12_PASSWORD != '' && secrets.IOS_PROFILE_BASE64 != '' }}
      CO_API: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dựng web rồi chép vào project iOS
        working-directory: apps/web
        run: pnpm build:ios
      - name: Số phiên bản
        id: ver
        run: |
          echo "name=$(node -p "require('./apps/web/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "code=$(( SO_BAN + BU_SO_BAN ))" >> "$GITHUB_OUTPUT"

      - name: Build cho simulator (chưa có bộ ký)
        if: env.CO_KY != 'true'
        working-directory: apps/web/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ steps.ver.outputs.name }} CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.code }} \
            -quiet build

      # KÝ THỦ CÔNG bằng chứng chỉ phân phối có sẵn — cách duy nhất Apple nhận
      # mà không cần iPhone đăng ký. Ba cách đã hỏng, đừng quay lại:
      #  - ký tự động (-allowProvisioningUpdates): Xcode ký kiểu Development
      #    trước, profile Development đòi team có thiết bị ("no devices");
      #  - archive không ký rồi để bước xuất ký: bản ra MẤT entitlements
      #    (`applesignin` — nút Đăng nhập Apple chết);
      #  - archive không ký + `codesign -s -` nhúng entitlements: xuất ra trông
      #    đúng nhưng Apple TỪ CHỐI lúc nhận bản ("Invalid Signature").
      - name: Nạp chứng chỉ + profile vào keychain tạm
        if: env.CO_KY == 'true'
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/ky.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/ky.p12"
          security import "$RUNNER_TEMP/ky.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/ky.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_ENV"
          # Xcode 16+ đọc chỗ thứ hai, bản cũ đọc chỗ thứ nhất
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/app.mobileprovision" "$d/$UUID.mobileprovision"
          done

      # Chỉ target App ký thủ công. Đặt CODE_SIGN_STYLE/PROVISIONING_PROFILE trên
      # dòng lệnh là áp cho CẢ các gói SPM (Capacitor…) — chúng không nhận
      # profile và build đỏ. Nên sửa file project ngay trên máy CI (không commit).
      - name: Archive đã ký
        if: env.CO_KY == 'true'
        working-directory: apps/web/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'EOF'
          import os
          p = 'App.xcodeproj/project.pbxproj'
          s = open(p).read()
          cu = 'CODE_SIGN_STYLE = Automatic;'
          assert s.count(cu) == 2, s.count(cu)   # đúng hai cấu hình Debug/Release của target App
          s = s.replace(cu, 'CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = %s; CODE_SIGN_IDENTITY = "Apple Distribution"; PROVISIONING_PROFILE_SPECIFIER = "%s";'
                        % (os.environ['TEAM'], os.environ['PROFILE_NAME']))
          open(p, 'w').write(s)
          EOF
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION=${{ steps.ver.outputs.name }} CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.code }} \
            -quiet archive

      # destination=upload: xuất xong Xcode đẩy thẳng lên App Store Connect
      # (TestFlight) bằng API key, không cần altool/fastlane.
      - name: Xuất IPA / đẩy lên TestFlight
        if: env.CO_KY == 'true'
        working-directory: apps/web/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          DEST=export
          AUTH=()
          if [ "$PHAT_HANH" = "true" ]; then
            [ "$CO_API" = "true" ] || { echo "::error::Phát hành cần ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64"; exit 1; }
            DEST=upload
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            AUTH=(-authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS")
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.hello314.flipmatch</key><string>$PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${AUTH[@]}"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          # Soát quyền đã ký vào app (Đăng nhập Apple phải còn — thiếu là nút đăng nhập chết)
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign -d --entitlements - "$APP" | grep -q applesignin \
            || { echo "::error::App ký ra thiếu entitlement com.apple.developer.applesignin"; exit 1; }
          codesign -dvv "$APP" 2>&1 | grep -E "^Authority=Apple Distribution"
      - if: env.CO_KY == 'true' && env.PHAT_HANH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lat-the-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-ios
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
      - name: Dọn keychain tạm
        if: always() && env.CO_KY == 'true'
        run: security delete-keychain "$RUNNER_TEMP/ky.keychain-db" || true
