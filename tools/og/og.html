<!doctype html>
<!--
  NGUỒN của apps/web/public/og.jpg (ảnh thẻ chia sẻ, 1200×630).

  Dựng bằng HTML rồi chụp bằng `node tools/og/render.mjs` — sửa nội dung là sửa
  chữ ở đây, không phải mở phần mềm đồ hoạ. Màu và font lấy đúng bộ của app
  (skin Kẹo, mặc định từ 13.10.2026; hai lá giống icon app phương án B).

  Chữ phải đọc được ở cỡ NHỎ: Facebook/Zalo hiện thẻ này rộng chừng 500px, tức
  bằng 42% cỡ thật. Vì thế tiêu đề rất lớn, chỉ 4 dòng tính năng, không có chữ
  nào dưới 22px.

  KHÔNG ghi CON SỐ nào (50 cấp, 4 mức bot, 5 chế độ…): số đổi liên tục, mà thẻ
  chia sẻ bị Facebook/Zalo cache rất lâu — ảnh sẽ nói sai trong nhiều tháng và
  không ai biết. Chỉ nói CÓ tính năng gì.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800&family=Grandstander:wght@900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: 'Be Vietnam Pro', sans-serif; color: #1d2a5a;
    background:
      radial-gradient(70px 26px at 7% 16%, #fff 97%, transparent),
      radial-gradient(46px 22px at 12.5% 13.5%, #fff 97%, transparent),
      radial-gradient(64px 24px at 92% 82%, #fff 97%, transparent),
      radial-gradient(40px 18px at 87% 80%, #fff 97%, transparent),
      radial-gradient(circle 44px at 93% 15%, #ffd84d 95%, transparent),
      radial-gradient(circle 86px at 93% 15%, rgba(255, 228, 120, .45) 55%, transparent),
      radial-gradient(70% 22% at 22% 106%, #4fb0ea 60%, transparent 61%),
      radial-gradient(90% 26% at 80% 110%, #3e9be0 60%, transparent 61%),
      #5cc2f2;
  }
  .la {
    position: absolute; width: 200px; height: 272px; box-sizing: border-box;
    border: 10px solid #1d2a5a; border-radius: 34px;
    display: flex; align-items: center; justify-content: center;
  }
  .la svg { width: 46%; }
  .sau { left: 92px; top: 200px; background: #2b4c9b; transform: rotate(-14deg); }
  .truoc { left: 236px; top: 160px; background: #fffbea; transform: rotate(10deg); box-shadow: 0 12px 0 #1d2a5a; }
  .truoc svg { width: 54%; }
  .chu { position: absolute; left: 540px; top: 118px; right: 60px; }
  h1 {
    margin: 0; font: 900 116px/1 'Grandstander'; color: #fff; letter-spacing: 1px;
    text-shadow: 5px 0 0 #1d2a5a, -5px 0 0 #1d2a5a, 0 5px 0 #1d2a5a, 0 -5px 0 #1d2a5a,
      4px 4px 0 #1d2a5a, -4px 4px 0 #1d2a5a, 4px -4px 0 #1d2a5a, -4px -4px 0 #1d2a5a, 0 9px 0 #1d2a5a;
  }
  .tag { margin: 22px 0 30px; font-size: 32px; font-weight: 800; }
  .ds { display: grid; grid-template-columns: repeat(2, max-content); gap: 14px 16px; }
  .vien { justify-self: start;
    padding: 10px 20px; border-radius: 999px; border: 4px solid #1d2a5a; box-shadow: 0 5px 0 #1d2a5a;
    font-size: 25px; font-weight: 800; background: #fff;
  }
  .v1 { background: #ffcb2e; } .v2 { background: #ff8fa8; } .v3 { background: #6ccb3a; } .v4 { background: #fff; }
</style>
</head>
<body>
  <div class="la sau"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#ffcb2e" stroke="#1d2a5a" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
  <div class="la truoc"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6c-2.3 4.5-9.3 9-9.3 9z" fill="#ff4d6d" stroke="#1d2a5a" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
  <div class="chu">
    <h1>Lật Thẻ</h1>
    <p class="tag">Game thẻ bài rèn luyện trí nhớ</p>
    <div class="ds">
      <span class="vien v1">Chơi một mình</span>
      <span class="vien v2">Đấu với máy</span>
      <span class="vien v3">Online cùng bạn bè</span>
      <span class="vien v4">Đổi giao diện</span>
    </div>
  </div>
</body>
</html>
