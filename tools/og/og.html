<!doctype html>
<!--
  NGUỒN của apps/web/public/og.jpg (ảnh thẻ chia sẻ, 1200×630).

  Dựng bằng HTML rồi chụp bằng `node tools/og/render.mjs` — sửa nội dung là sửa
  chữ ở đây, không phải mở phần mềm đồ hoạ. Màu và font lấy đúng bộ của app.

  Chữ phải đọc được ở cỡ NHỎ: Facebook/Zalo hiện thẻ này rộng chừng 500px, tức
  bằng 42% cỡ thật. Vì thế tiêu đề rất lớn, chỉ 4 dòng tính năng, không có chữ
  nào dưới 22px.

  KHÔNG ghi CON SỐ nào (50 cấp, 4 mức bot, 5 chế độ…): số đổi liên tục, mà thẻ
  chia sẻ bị Facebook/Zalo cache rất lâu — ảnh sẽ nói sai trong nhiều tháng và
  không ai biết. Chỉ nói CÓ tính năng gì.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: Nunito, sans-serif; color: #fff;
    background:
      radial-gradient(900px 500px at 78% 18%, rgba(139, 92, 246, .55), transparent 62%),
      radial-gradient(700px 420px at 12% 88%, rgba(16, 158, 219, .35), transparent 60%),
      linear-gradient(140deg, #150f3a 0%, #241c6e 45%, #3b2a7d 100%);
    display: flex; align-items: center; gap: 56px; padding: 0 76px;
  }

  /* Xấp thẻ: hai lá úp xoè ra, một lá đã mở */
  .fan { position: relative; width: 340px; height: 400px; flex-shrink: 0; }
  .card {
    position: absolute; width: 186px; height: 262px; border-radius: 24px;
    box-shadow: 0 26px 60px rgba(0, 0, 0, .45);
  }
  .back {
    background: linear-gradient(160deg, #4c3fd6, #7b46e6 55%, #b74cf0);
    display: flex; align-items: center; justify-content: center;
  }
  .back::after {
    content: ''; width: 74px; height: 74px; transform: rotate(45deg);
    border: 3px solid rgba(255, 255, 255, .85);
    background: rgba(255, 255, 255, .16);
    border-radius: 6px;
  }
  .c1 { left: 0;   top: 78px; transform: rotate(-13deg); }
  .c2 { left: 74px; top: 52px; transform: rotate(-4deg); }
  .up {
    left: 152px; top: 88px; transform: rotate(9deg);
    background: #fff; color: #1e1b4b;
    display: flex; align-items: center; justify-content: center; font-size: 116px;
  }

  .text { flex: 1; min-width: 0; }
  h1 {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 140px;
    line-height: 1; letter-spacing: -1px;
    background: linear-gradient(96deg, #c4b5fd 0%, #f0abfc 48%, #fda4af 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { font-size: 34px; font-weight: 700; color: rgba(255, 255, 255, .92); margin-top: 6px; }

  .feats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-top: 30px; }
  .f {
    display: flex; align-items: center; gap: 11px;
    font-size: 25px; font-weight: 700; color: rgba(255, 255, 255, .95);
    background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 999px; padding: 11px 20px; white-space: nowrap;
  }
  .f i { font-style: normal; font-size: 27px; }
</style>
</head>
<body>
  <div class="fan">
    <div class="card back c1"></div>
    <div class="card back c2"></div>
    <div class="card up">🦊</div>
  </div>
  <div class="text">
    <h1>Lật Thẻ</h1>
    <p class="tag">Game thẻ bài rèn luyện trí nhớ</p>
    <div class="feats">
      <span class="f"><i>🗺️</i> Nhiều cấp độ</span>
      <span class="f"><i>🎮</i> Nhiều chế độ chơi</span>
      <span class="f"><i>🤖</i> Đấu với máy</span>
      <span class="f"><i>🌐</i> Thi đấu online</span>
    </div>
  </div>
</body>
</html>
